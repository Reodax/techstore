<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - TechStore</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .auth-title {
            text-align: center;
            margin-bottom: 2rem;
            color: #2c3e50;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-weight: 600;
            color: #2c3e50;
        }

        .form-group input {
            padding: 0.8rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }

        .auth-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .auth-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .google-btn {
            background: #fff !important;
            color: #444 !important;
            border: 1px solid #ddd !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 0.5rem !important;
            width: 100% !important;
        }

        .google-btn:hover {
            background: #f8f9fa !important;
            border-color: #ccc !important;
            transform: translateY(-2px);
        }

        .auth-switch {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e9ecef;
        }

        .auth-switch a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        /* Модальное окно для имени */
        .name-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
        }

        .name-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .name-modal-content {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .name-modal-title {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 1rem;
            text-align: center;
        }

        .name-modal-text {
            color: #7f8c8d;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .user-status {
            text-align: center;
            margin-bottom: 1rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <h1>TechStore</h1>
                </a>
            </div>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="nav">
                <a href="index.html">Главная</a>
                
                <div class="nav-dropdown">
                    <a>Комплектующие</a>
                    <div class="dropdown-menu">
                        <!-- Категории будут загружены динамически через js/categories.js -->
                    </div>
                </div>
                
                <div class="nav-dropdown">
                    <a>Готовые сборки</a>
                    <div class="dropdown-menu">
                        <div class="dropdown-section">Полные системы</div>
                        <a href="builds.html#gaming">Игровые сборки</a>
                        <a href="builds.html#workstation">Рабочие станции</a>
                        <a href="builds.html#budget">Бюджетные сборки</a>
                        <a href="builds.html">Все сборки</a>
                    </div>
                </div>
                
                <a href="cart.html">Корзина <span id="cart-count">0</span></a>
                
                <a href="profile.html" class="user-info" style="display: none;"></a>
                <a href="login.html" class="login-btn nav-active">Вход</a>
                <a href="#" class="logout-btn" style="display: none;">Выйти</a>
                
                <a href="admin.html" class="admin-link">Админ панель</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="auth-container">
                <h2 class="auth-title" id="auth-title">Вход в аккаунт</h2>

                <!-- Форма входа -->
                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="login-email">Email:</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Пароль:</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="auth-btn" id="login-btn" style="margin-bottom: 0.5rem;">Войти</button>
                    <div style="text-align: center; color: #7f8c8d; font-size: 0.85rem; margin: 0;">или</div>
                    <button type="button" class="auth-btn google-btn" id="google-login-btn" style="margin-top: 0.5rem;">
                        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
                        Войти через Google
                    </button>
                </form>

                <!-- Форма регистрации -->
                <form id="register-form" class="auth-form" style="display: none;">
                    <div class="form-group">
                        <label for="register-name">Имя:</label>
                        <input type="text" id="register-name" required>
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email:</label>
                        <input type="email" id="register-email" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Пароль:</label>
                        <input type="password" id="register-password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="register-confirm-password">Подтвердите пароль:</label>
                        <input type="password" id="register-confirm-password" required>
                    </div>
                    <button type="submit" class="auth-btn" id="register-btn" style="margin-bottom: 0.5rem;">Зарегистрироваться</button>
                    <div style="text-align: center; color: #7f8c8d; font-size: 0.85rem; margin: 0;">или</div>
                    <button type="button" class="auth-btn google-btn" id="google-register-btn" style="margin-top: 0.5rem;">
                        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
                        Войти через Google
                    </button>
                </form>

                <div class="auth-switch">
                    <span id="login-switch-text">Нет аккаунта? </span>
                    <a href="#" id="show-register">Зарегистрироваться</a>
                    <a href="#" id="show-login" style="display: none;">Войти</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 TechStore. Все права защищены.</p>
        </div>
    </footer>

    <!-- Модальное окно для ввода имени -->
    <div id="name-modal" class="name-modal">
        <div class="name-modal-content">
            <h3 class="name-modal-title">Добро пожаловать! 👋</h3>
            <p class="name-modal-text">Как вас зовут?</p>
            <form id="name-form" class="auth-form">
                <div class="form-group">
                    <label for="user-name-input">Ваше имя:</label>
                    <input type="text" id="user-name-input" required placeholder="Введите ваше имя">
                </div>
                <button type="submit" class="auth-btn">Продолжить</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-categories.js"></script>
    <script src="js/firebase-auth.js"></script>
    <script src="js/firebase-orders.js"></script>
    
    <script src="js/cart.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/dropdown.js"></script>
    <script src="js/mobile-menu.js"></script>
    
    <script>
        // Переключение между формами входа и регистрации
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const showRegister = document.getElementById('show-register');
            const showLogin = document.getElementById('show-login');
            const authTitle = document.getElementById('auth-title');
            const loginSwitchText = document.getElementById('login-switch-text');

            // Показать форму регистрации
            showRegister.addEventListener('click', function(e) {
                e.preventDefault();
                
                // Полностью скрываем форму входа
                loginForm.style.display = 'none';
                loginForm.style.visibility = 'hidden';
                loginForm.style.position = 'absolute';
                
                // Показываем форму регистрации
                registerForm.style.display = 'flex';
                registerForm.style.visibility = 'visible';
                registerForm.style.position = 'relative';
                
                showRegister.style.display = 'none';
                showLogin.style.display = 'inline';
                authTitle.textContent = 'Регистрация';
                loginSwitchText.textContent = 'Уже есть аккаунт? ';
            });

            // Показать форму входа
            showLogin.addEventListener('click', function(e) {
                e.preventDefault();
                
                // Полностью скрываем форму регистрации
                registerForm.style.display = 'none';
                registerForm.style.visibility = 'hidden';
                registerForm.style.position = 'absolute';
                
                // Показываем форму входа
                loginForm.style.display = 'flex';
                loginForm.style.visibility = 'visible';
                loginForm.style.position = 'relative';
                
                showLogin.style.display = 'none';
                showRegister.style.display = 'inline';
                authTitle.textContent = 'Вход в аккаунт';
                loginSwitchText.textContent = 'Нет аккаунта? ';
            });

            // Вход через Google (для формы входа)
            const googleLoginBtn = document.getElementById('google-login-btn');
            if (googleLoginBtn) {
                googleLoginBtn.addEventListener('click', async function() {
                    const result = await loginWithGoogle();
                    
                    if (result.success) {
                        // Если новый пользователь - запрашиваем имя
                        if (result.isNewUser) {
                            showNameModal(result.user);
                        } else {
                            // Переносим корзину гостя в аккаунт пользователя
                            const guestCart = JSON.parse(localStorage.getItem('techstore_guest_cart') || '[]');
                            if (guestCart.length > 0) {
                                cart.mergeGuestCart(guestCart);
                                localStorage.removeItem('techstore_guest_cart');
                            }
                            
                            alert('Вход через Google выполнен успешно!');
                            window.location.href = 'index.html';
                        }
                    } else {
                        alert(result.message);
                    }
                });
            }

            // Вход через Google (для формы регистрации)
            const googleRegisterBtn = document.getElementById('google-register-btn');
            if (googleRegisterBtn) {
                googleRegisterBtn.addEventListener('click', async function() {
                    const result = await loginWithGoogle();
                    
                    if (result.success) {
                        // Если новый пользователь - запрашиваем имя
                        if (result.isNewUser) {
                            showNameModal(result.user);
                        } else {
                            // Переносим корзину гостя в аккаунт пользователя
                            const guestCart = JSON.parse(localStorage.getItem('techstore_guest_cart') || '[]');
                            if (guestCart.length > 0) {
                                cart.mergeGuestCart(guestCart);
                                localStorage.removeItem('techstore_guest_cart');
                            }
                            
                            alert('Вход через Google выполнен успешно!');
                            window.location.href = 'index.html';
                        }
                    } else {
                        alert(result.message);
                    }
                });
            }

            // Функция показа модального окна для ввода имени
            function showNameModal(user) {
                const modal = document.getElementById('name-modal');
                const nameForm = document.getElementById('name-form');
                const nameInput = document.getElementById('user-name-input');
                
                // Предзаполняем имя из Google, если есть
                if (user.displayName) {
                    nameInput.value = user.displayName;
                }
                
                modal.classList.add('active');
                
                // Обработчик отправки формы
                nameForm.onsubmit = async function(e) {
                    e.preventDefault();
                    
                    const userName = nameInput.value.trim();
                    if (!userName) {
                        alert('Пожалуйста, введите ваше имя');
                        return;
                    }
                    
                    // Создаем профиль с указанным именем
                    const createResult = await createGoogleUserProfile(user.uid, user.email, userName);
                    
                    if (createResult.success) {
                        // Переносим корзину гостя в аккаунт пользователя
                        const guestCart = JSON.parse(localStorage.getItem('techstore_guest_cart') || '[]');
                        if (guestCart.length > 0) {
                            cart.mergeGuestCart(guestCart);
                            localStorage.removeItem('techstore_guest_cart');
                        }
                        
                        modal.classList.remove('active');
                        alert('Добро пожаловать, ' + userName + '! 🎉');
                        window.location.href = 'index.html';
                    } else {
                        alert('Ошибка создания профиля. Попробуйте еще раз.');
                    }
                };
            }
        });
    </script>
</body>
</html>
