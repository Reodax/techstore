<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс данных - TechStore</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 0.5rem;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            background: #f0f0f0;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Сброс данных</h1>
        <p>Эта страница поможет вам сбросить все данные сайта (категории, товары, корзину) и загрузить дефолтные значения.</p>
        
        <button class="btn" onclick="resetData()">Сбросить все данные</button>
        <button class="btn btn-secondary" onclick="resetCategories()">Сбросить только категории</button>
        <br><br>
        <button class="btn" onclick="goHome()">Вернуться на главную</button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        function showStatus(message, isSuccess = true) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status' + (isSuccess ? ' success' : '');
            status.style.display = 'block';
            
            if (isSuccess) {
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }
        }
        
        function resetData() {
            if (confirm('Вы уверены? Это удалит все данные (категории, товары, корзину, избранное).')) {
                try {
                    localStorage.clear();
                    showStatus('✅ Все данные успешно сброшены! Перенаправление на главную...');
                } catch (e) {
                    showStatus('❌ Ошибка при сбросе данных: ' + e.message, false);
                }
            }
        }
        
        function resetCategories() {
            if (confirm('Вы уверены? Это сбросит только категории к дефолтным значениям.')) {
                try {
                    localStorage.removeItem('techstore_categories');
                    showStatus('✅ Категории успешно сброшены! Перенаправление на главную...');
                } catch (e) {
                    showStatus('❌ Ошибка при сбросе категорий: ' + e.message, false);
                }
            }
        }
        
        function goHome() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
